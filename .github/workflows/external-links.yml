name: External link checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --exclude-mail
            --exclude 'eng2e\.seismic\.com'
            --exclude 'ra\.seismic\.com'
            --exclude 'rockwellautomation\.custhelp\.com'
            './docs/**/*.html'
