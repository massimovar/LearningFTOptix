name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate source catalog
        run: python scripts/check_site.py --root docs --mode source

      - name: Validate release data
        run: python scripts/check_site.py --root docs --mode releases

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --exclude-mail
            --exclude 'eng2e\.seismic\.com'
            --exclude 'ra\.seismic\.com'
            --exclude 'rockwellautomation\.custhelp\.com'
            './docs/**/*.html'
