# Random hero quotes shown on the home page.
# Source: https://folklore.org/html/quotes.html (CC BY-NC 1.0, Andy Hertzfeld / folklore.org)
- text: "The best way to predict the future is to invent it."
  author: "Alan Kay"
- text: "People who are really serious about software should make their own hardware."
  author: "Alan Kay"
- text: "The only way to do great work is to love what you do."
  author: "Steve Jobs"
- text: "He not busy being born is busy dying."
  author: "Bob Dylan"
- text: "History is always written wrong, and so always needs to be rewritten."
  author: "George Santayana"
- text: "To love what you do and feel that it matters — how could anything be more fun?"
  author: "Katharine Graham"
- text: "If everything is under control, you're going too slow."
  author: "Mario Andretti"
- text: "Our task is to read things that are not yet on the page."
  author: "Steve Jobs"
- text: "Never doubt that a small group of thoughtful, committed people can change the world. Indeed, it's the only thing that ever has."
  author: "Margaret Mead"
- text: "There's only one rule in user interface design: Make the user happy."
  author: "Bill Atkinson"
- text: "The future is here. It's just not evenly distributed yet."
  author: "William Gibson"
- text: "Real artists ship."
  author: "Steve Jobs"
- text: "It is your work in life that is the ultimate seduction."
  author: "Pablo Picasso"
- text: "The recipe for great work is: very exacting taste, plus the ability to gratify it."
  author: "Paul Graham"
- text: "Expose yourself to the best things humans have done and then try to bring those things into what you are doing."
  author: "Steve Jobs"
- text: "Every act of creation is first of all an act of destruction."
  author: "Pablo Picasso"
- text: "Art is a lie that makes us realize the truth."
  author: "Pablo Picasso"
- text: "He can who thinks he can, and he can't who thinks he can't. This is an inexorable, indisputable law."
  author: "Pablo Picasso"
- text: "A designer knows that he has achieved perfection not when there is nothing left to add, but when there is nothing left to take away."
  author: "Antoine de Saint-Exupéry"
- text: "Form follows function — that has been misunderstood. Form and function should be one, joined in a spiritual union."
  author: "Frank Lloyd Wright"
- text: "When I'm working on a problem, I never think about beauty. I think only how to solve the problem. But when I have finished, if the solution is not beautiful, I know it is wrong."
  author: "R. Buckminster Fuller"
- text: "The details are not the details. They make the design."
  author: "Charles Eames"
- text: "Hell, there are no rules here — we're trying to accomplish something."
  author: "Thomas Edison"
- text: "Good artists copy, great artists steal."
  author: "Picasso via Steve Jobs"
- text: "It's better to be a pirate than join the Navy."
  author: "Steve Jobs"
- text: "Make it as simple as possible. But no simpler."
  author: "Albert Einstein"
- text: "There are two ways of constructing a software design: one way is to make it so simple that there are obviously no deficiencies, and the other way is to make it so complicated that there are no obvious deficiencies. The first method is far more difficult."
  author: "Tony Hoare"
- text: "Better is the enemy of best."
  author: "Alan Kay"
- text: "Systems programmers are high priests of a low cult."
  author: "Alan Kay"
- text: "Simplicity is the ultimate sophistication."
  author: "Leonardo da Vinci"
- text: "The physicist's greatest tool is his wastebasket."
  author: "Albert Einstein"
- text: "If you don't live it, it won't come out of your horn."
  author: "Charlie Parker"
- text: "I can't understand why people are frightened of new ideas. I'm frightened of the old ones."
  author: "John Cage"
- text: "To live outside the law you must be honest."
  author: "Bob Dylan"
- text: "It's always necessary to seek for perfection. Obviously, for us, this word no longer has the same meaning. To me, it means: from one canvas to the next, always go further, further..."
  author: "Pablo Picasso"
- text: "Art is a passion or it is nothing."
  author: "Roger Fry"
- text: "Technique alone is never enough. You have to have passion. Technique alone is just an embroidered pot holder."
  author: "Raymond Chandler"
- text: "The noun of self becomes a verb. This flashpoint of creation in the present moment is where work and play merge."
  author: "Stephen Nachmanovitch"
- text: "The creation of art is not the fulfillment of a need but the creation of a need. The world never needed Beethoven's Fifth Symphony until he created it. Now we could not live without it."
  author: "Louis Kahn"
- text: "An invincible determination can accomplish almost anything and in this lies the great distinction between great men and little men."
  author: "Thomas Fuller"
- text: "Great software requires a fanatical devotion to beauty."
  author: "Paul Graham"
- text: "Simple things should be simple. Complex things should be possible."
  author: "Alan Kay"
- text: "Less is more."
  author: "Mies van der Rohe"
