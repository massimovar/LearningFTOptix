- version: "1.3"
  slug: release-1-3
  date: "January 2024"
  date_iso: "2024-01-01"
  pdf: "/pdf/ftoptix/releases/FTOptix v1.3.pdf"
  summary: "Version 1.3 expanded project recovery, responsive UI, security, OPC UA, Linux and Docker deployment, resilient web clients, and collaborative Git workflows."
  source_pages: "Source: FactoryTalk Optix v1.3 release presentation. Overview pp. 3-4; detailed feature pages are cited above."
  highlights:
    - title: "Project source recovery"
      description: "Stores source with a deployment and uploads it later from PCs, OptixPanels, or Embedded Edge Compute devices."
    - title: "Responsive HMI toolkit"
      description: "Adds new buttons, richer trends, Sparkline, expression functions, PWA support, and content wrapping."
    - title: "Security and maintainability"
      description: "Adds role-based security, alarm improvements, stylesheet sub-styles, multi-monitor Studio, and better diagnostics."
    - title: "Linux, Docker, web, and Git expansion"
      description: "Adds Ubuntu 22, disconnected Docker licensing, reconnecting web clients, and broader Git-provider support."
  categories:
    - name: "Core capabilities"
      items:
        - title: "Project upload from device"
          detail: "Stores source with a deployment and later uploads it from PCs, OptixPanels, or Embedded Edge Compute devices."
