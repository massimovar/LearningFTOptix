        - title: "Momentary, Toggle, and Delayed buttons"
          detail: "Adds button behaviors for held, switched, and long-press interactions."
          pages: "p. 7"
        - title: "Trend improvements"
          detail: "Adds thresholds, time trace, range minimum/maximum/average, pen titles, axis placement, and snap options."
          pages: "p. 8"
