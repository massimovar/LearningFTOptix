- version: "1.8"
  slug: release-1-8
  date: "September 2026"
  date_iso: "2026-09-01"
  current: true
  pdf: "/pdf/ftoptix/releases/FTOptix v1.8.pdf"
  summary: "A scale-out release introducing three-node High Availability, workstation clients, Base + Extended runtime licensing, ThinManager-managed containers, an AI documentation assistant in Studio, and richer MQTT data exchange."
  source_pages: "Source: FactoryTalk Optix v1.8 technical overview. Focus areas p. 5; detailed feature pages are cited above."
  notes:
    - "The presentation is marked as preliminary release information and subject to change."
    - "Page references use PDF page numbers. From PDF page 39 onward, the slide number printed on each page is one higher."
    - "The overview on p. 5 groups ThinManager SSO and Base + Extended licensing under Expanded Architectures. This timeline lists them in separate categories that match the dedicated chapters of the presentation."
    - "The Memory Optimization slide on p. 11 contains only placeholder text and is excluded from this inventory."
    - "Firmware 7.0.0.x for Optix-based devices (pp. 55-63) is covered in the separate Optix-based devices firmware release timeline."
  highlights:
    - title: "Three-node High Availability"
      description: "Deploys the runtime to a Kubernetes-based cluster with automatic failover and a virtual IP, licensed with new Extended Feature Tokens instead of separate runtime licenses."
    - title: "Workstation clients and ThinManager integration"
      description: "Installs Optix applications on workstations from the browser and runs them in ThinManager-managed containers with user single sign-on."
    - title: "AI Design-Time Assistant"
      description: "Answers how-to questions inside Optix Studio with responses grounded in official documentation, source links, and session context."
    - title: "Richer MQTT and drive connectivity"
      description: "Publishes complex data models and Event Logger data over MQTT and adds a direct EtherNet/IP driver for PowerFlex drives."
  categories:
    - name: "Core capabilities"
      items:
        - title: "Retentivity backup and restore"
          detail: "Adds Retentivity Storage methods that save the current retentive data state to a backup file and restore it from an existing backup."
          pages: "p. 7"
        - title: "Web file download and upload"
          detail: "Adds UI Session methods that download files from the runtime to the client device and upload files from the client device to the runtime."
          pages: "p. 8"
        - title: "Report DataGrid word wrap"
          detail: "Wraps long cell content such as timestamps, batch records, audit logs, and operator notes across multiple lines."
          pages: "p. 9"
        - title: "RA EtherNet/IP design-time API"
          detail: "Browses controller tags programmatically and imports them at design time through NetLogic."
          pages: "p. 10"
        - title: "Recipe Schema design-time APIs"
          detail: "Creates and modifies Recipe Schemas through NetLogic to automate recipe setup and maintenance."
          pages: "p. 10"
    - name: "Data connectivity"
      items:
        - title: "RA Device Driver for PowerFlex drives"
          detail: "Communicates directly with PowerFlex drives over EtherNet/IP with DPI Port 0 parameter access. Validated with PowerFlex 525, 755 (including TS, TR, TL, TM Bus Supply, and TM-CBI variants), 6000T, and 7000."
          pages: "p. 41"
        - title: "Event Logger MQTT publishing"
          detail: "Maps an existing user-defined Event Logger to an MQTT Publisher to stream runtime events to external systems and cloud analytics."
          pages: "p. 42"
        - title: "MQTT complex data types"
          detail: "Lets the MQTT Publisher and Subscriber exchange folders, nested objects, variables, properties, arrays, and complex structures instead of only atomic values."
          pages: "p. 43"
    - name: "Expanded architectures"
      items:
        - title: "Workstation clients"
          detail: "Installs Optix applications on workstations directly from the browser, launches them from the desktop, and limits the maximum number of workstation client connections."
          pages: "p. 13"
        - title: "Three-node High Availability runtime cluster"
          detail: "Runs one active node and two standby nodes, each holding a full copy of critical data. Failover is automatic, failed nodes resynchronize when they return, and clients reconnect through a virtual IP."
          pages: "pp. 14-17"
        - title: "Kubernetes-based High Availability"
          detail: "Uses K3s lightweight Kubernetes on Linux nodes and supports any Kubernetes-compliant cluster at version 1.34.6 or later."
          pages: "pp. 18-19"
        - title: "FactoryTalk Optix High Availability Manager"
          detail: "Installs and manages the cluster bundle, including Keepalived, K3s, the installable runtime, RuntimeMonitor, UpdateServer, and a MariaDB Galera cluster, and configures MQTT, OPC UA, and Web Presentation Engine ports."
          pages: "p. 20"
        - title: "High Availability deployment option"
          detail: "Enables High Availability in the Optix project and deploys it with the HA Manager. A cluster uses one Optix Runtime entitlement plus Extended Feature Tokens instead of separate runtime licenses."
          pages: "p. 21"
    - name: "ThinManager integration"
      items:
        - title: "ThinManager-managed runtime containers"
          detail: "Exports an application from Optix Studio as a ZIP file and runs it with the Native Presentation Engine in a ThinManager 14.2 container on thin clients."
          pages: "pp. 23, 25"
        - title: "ThinManager-managed web clients"
          detail: "Visualizes Optix Web UI applications through Chrome or Firefox containers on thin clients, without RDS-hosted browsers."
          pages: "p. 24"
        - title: "ThinManager user SSO"
          detail: "Passes ThinManager authentication through to containerized Optix applications. Requires the FactoryTalk Optix ThinManager extension for Optix Studio, published on ThinManager.com after the v1.8 release."
          pages: "p. 29"
        - title: "ThinManager container licensing"
          detail: "Each terminal requires an Optix Container Display Client with a unique entitlement key. ThinManager 14.2 supports only online entitlements for Docker container deployments."
          pages: "p. 26"
        - title: "Disconnected container licensing"
          status: "Coming soon"
          detail: "Disconnected license support for Optix running in a ThinManager container is planned with Optix 1.8 and ThinManager 14.3."
          pages: "p. 28"
    - name: "Digital design experience"
      items:
        - title: "AI Design-Time Assistant"
          detail: "Opens a chat panel in desktop Optix Studio that answers how-to and concept questions using semantic search, source links, copyable answers, and memory of up to 100 question-and-answer pairs per session."
          pages: "pp. 30-33"
        - title: "AI assistant prerequisites"
          detail: "Requires desktop Optix Studio 1.8, an active FactoryTalk Hub Pro subscription, and internet access. A Studio Pro entitlement is required for all AI Design Assistance features."
          pages: "pp. 34, 38"
        - title: "Responsible AI boundaries"
          detail: "Provides advisory guidance only, with no PLC writes, runtime control, or autonomous project changes. Only the question and relevant documentation are sent to Azure OpenAI, and customer data is not used for training."
          pages: "pp. 34-35"
        - title: "AI Design Assistance direction"
          status: "Planned direction"
          detail: "Future releases plan auto-generation of models, properties, and backend connectivity, and screen generation from Figma designs, photos, or hand-drawn sketches, with initial releases planned for v1.9 and v2.0."
          pages: "p. 38"
        - title: "FactoryTalk Design Studio offline tag import"
          detail: "Imports tags offline from a Logix controller in a FactoryTalk Design Studio project before it is deployed, including FTDS device names and routine-scoped tags."
          pages: "p. 39"
    - name: "Runtime licensing"
      items:
        - title: "Base + Extended runtime licensing"
          detail: "Keeps the Base Feature Token packages XS, S, M, L, and XL (5, 8, 11, 15, and 21 tokens) and adds Extended packages XXS, XS, and S (3, 5, and 10 tokens). The PDF states availability in early fall 2026."
          pages: "pp. 45-47"
        - title: "Features requiring Extended Tokens"
          detail: "A three-node High Availability cluster uses 3 Extended Tokens. Workstation clients use 1, 2, 3, or 5 tokens for 1, up to 3, up to 5, or up to 10 sessions."
          pages: "p. 49"
        - title: "Runtime sizing tools"
          detail: "Releases an updated Runtime Sizing Calculator, shows the required license size in Optix Studio, and updates the Optix Ordering Guide for Extended licenses."
          pages: "p. 54"
    - name: "FactoryTalk Hub and resources"
      items:
        - title: "Instant online demos"
          detail: "Runs Optix demo applications in the browser from the FactoryTalk Hub Resources tab and links to their source files on GitHub."
          pages: "p. 67"
        - title: "PCDC release notifications"
          detail: "Subscribes to FactoryTalk Optix in the Product Compatibility and Download Center to receive new-release notifications, optionally by email."
          pages: "p. 69"
        - title: "2026 Visualization Deep Dive webinars"
          detail: "Covers High Availability, multi-node architectures with Rockwell Automation hardware, and AI assistants in FactoryTalk Optix and FactoryTalk View, live and on demand."
          pages: "p. 65"

- version: "1.7"
  slug: release-1-7
  date: "January 2026"
  date_iso: "2026-01-01"
  pdf: "/pdf/ftoptix/releases/FTOptix v1.7.pdf"
  video: "https://www.youtube.com/watch?v=yjK06nGgBUk"
  video_label: "ASEM release webinar (Italian)"
  summary: "A broad modernization release centered on scalable recipes, data-driven UI, runtime diagnostics, resilient MQTT, stronger security, and tighter engineering integration."
  source_pages: "Source: FactoryTalk Optix v1.7 release presentation. Overview p. 3; detailed feature pages are cited above."
  notes:
    - "The release overview places security under Expanded Architectures and Alarm Widget improvements under Core Capabilities. Their detail slides use different section labels; this timeline follows the overview for consistency."
  highlights:
    - title: "Redesigned Recipe module"
      description: "Supports unlimited parameters, concurrent editing, object-aware schemas, richer methods, metadata, and a ListView-based recipe widget."
    - title: "ListView and engineering diagnostics"
      description: "Adds virtualized data lists, broken-link detection, UI scaling, Web UI automation identifiers, and runtime performance improvements."
    - title: "Resilient MQTT and Azure connectivity"
      description: "Adds DataLogger publishing, store-and-forward, Azure publish/subscribe, and Last Will and Testament support."
    - title: "Enterprise integration and security"
      description: "Adds FTDS integration, protected third-party drivers, AssetCentre recovery, PlantPAx 5.20, OAuth 2.0, and LDAPS."
  categories:
    - name: "Core capabilities"
      items:
        - title: "Redesigned Recipe module"
          detail: "Supports unlimited parameters, concurrent runtime editing, object-aware parameters, expanded OPC UA methods, and user metadata."
          pages: "p. 5"
        - title: "Recipe schema configurator"
          detail: "Adds a design-time configurator for creating and previewing recipe schemas."
          pages: "p. 6"
        - title: "Recipe application widget"
          detail: "Provides a new ListView-based widget for browsing and operating recipe data."
          pages: "p. 7"
        - title: "ListView and ListViewRow"
          detail: "Render Model, database, and Recipe Schema sources with sorting, filtering, and virtualization for large datasets."
          pages: "pp. 8-9"
        - title: "Unresolved and broken link view"
          detail: "Finds invalid DynamicLinks, unresolved DynamicLinks, and broken NodePointers."
          pages: "p. 10"
        - title: "Runtime UI scaling"
          detail: "Adds a per-session, per-origin persistent scaling factor for DPI and responsive-design scenarios."
          pages: "p. 11"
        - title: "Web UI automation identifiers"
          detail: "Optionally emits data-automationid attributes to support automated Web UI testing."
          pages: "p. 12"
        - title: "Library workflow improvements"
          detail: "Adds Content and Info tabs, type detection, dependency handling, and fewer dialog interactions."
          pages: "p. 13"
        - title: "Reports on headless devices"
          detail: "Generates reports on 1756-CMEE and OptixEdge devices running firmware 6.0.3.x or later."
          pages: "p. 14"
        - title: "Image tile fill mode"
          detail: "Adds tiled rendering for Image, MultiStateImage, and AdvancedSVGImage objects."
          pages: "p. 15"
        - title: "Virtual Keyboard improvements"
          detail: "Shows engineering units and ranges, opens from non-input controls, and supports signed-number entry."
          pages: "p. 16"
        - title: "Runtime performance improvements"
          detail: "Optimizes deployed DynamicLinks, alarm-memory use, Web Presentation Engine performance, and page changes."
          pages: "p. 17"
        - title: "Text trimming"
          detail: "Adds a text-box option for handling content that exceeds the available display area."
          pages: "p. 3"
        - title: "User-defined project template improvements"
          detail: "Adds favorites, display names, descriptions, filtering, and a clear edit-mode banner."
          pages: "p. 20"
        - title: "SD-card file storage"
          detail: "Makes SD-card paths available to File System Browser, Select File, and FTP Server through the %SD<n>% syntax."
          pages: "p. 21"
        - title: "Alarm Widget improvements"
          detail: "Adds small-screen layouts, predefined and custom filters, and simpler configuration."
          pages: "pp. 3, 26"
    - name: "Data connectivity"
      items:
        - title: "Logix extended-property pass-through"
          detail: "Passes supported extended tag properties through to connected application data."
          pages: "p. 29"
        - title: "MQTT DataLogger publishing"
          detail: "Publishes DataLogger records directly through the MQTT client."
          pages: "p. 30"
        - title: "MQTT Last Will and Testament"
          detail: "Configures an LWT message that the broker publishes after an unexpected client disconnect."
          pages: "p. 31"
        - title: "MQTT client store-and-forward"
          detail: "Buffers 1 to 100,000 messages and can overwrite the oldest messages when the buffer is full."
          pages: "p. 32"
        - title: "Azure Connector"
          detail: "Supports IoT Hub publishing, Event Grid publish/subscribe, MQTT 3.1.1 and 5.0, DataLogger publishing, LWT, and guided setup."
          pages: "p. 33"
    - name: "Expanded architectures"
      items:
        - title: "Project-secret password policies"
          detail: "Adds password-complexity rules for user-provided project-secret encryption."
          pages: "pp. 3, 18"
        - title: "OAuth 2.0 for the Web UI"
          detail: "Extends OAuth 2.0 authentication to Web UI sessions."
          pages: "pp. 3, 18"
        - title: "Secure LDAP"
          detail: "Adds LDAPS support for encrypted directory communication."
          pages: "pp. 3, 18"
        - title: "Allowed local Web Presentation sources"
          detail: "Restricts which local sources the Web Presentation Engine can load."
          pages: "p. 19"
        - title: "Beckhoff TwinCAT tag import"
          detail: "Imports Beckhoff tags through design-time NetLogic."
          pages: "p. 23"
        - title: "Protected Siemens and CODESYS communication"
          detail: "Adds password-protected Siemens access and user, password, and certificate protection for CODESYS."
          pages: "p. 23"
        - title: "FactoryTalk AssetCentre integration"
          detail: "Adds disaster-recovery integration for FactoryTalk Optix applications."
          pages: "p. 3"
        - title: "PlantPAx Process Library 5.20"
          detail: "Adds support for the PlantPAx 5.20 process library."
          pages: "p. 3"
    - name: "Digital design experience"
      items:
        - title: "FactoryTalk Design Studio runtime communication"
          detail: "Connects to FTDS controllers at runtime and recognizes FTDS device names."
          pages: "p. 25"
        - title: "FactoryTalk Design Studio online tag import"
          detail: "Imports online Logix tags, including routine-scoped tags, from FTDS projects."
          pages: "p. 25"
        - title: "Tag Importer auto-refresh control"
          detail: "Allows automatic Tag Importer refresh to be enabled or disabled."
          pages: "p. 3"
        - title: "Git workflow improvements"
          detail: "Adds asynchronous retrieval, repository navigation links, identity management, project repository details, and GitLab subgroup support."
          pages: "p. 27"

- version: "1.6"
  slug: release-1-6
  date: "March 2025"
  date_iso: "2025-03-01"
  pdf: "/pdf/ftoptix/releases/FTOptix v1.6.pdf"
  video: "https://ra.seismic.com/Link/Content/DCpJBmH9hTBV287CQ7389D42hHpV"
  video_label: "Rockwell Automation video summary"
  summary: "This release emphasized reusable project foundations, structured-data engineering, automated delivery, Rockwell Automation connectivity, resilient edge data, and container export."
  source_pages: "Source: FactoryTalk Optix v1.6 release presentation. Overview p. 4; detailed feature pages are cited above."
  notes:
    - "The structured Model-to-controller-tag single DynamicLink shown on p. 11 is marked as coming in v1.7 and is intentionally excluded from this v1.6 inventory."
  highlights:
    - title: "Reusable project templates and structured data"
      description: "Standardizes project foundations and makes structured datatypes easier to display, edit, and bind."
    - title: "Automated build and library workflows"
      description: "Adds Studio CLI build and deployment plus design-time NetLogic library import."
    - title: "Expanded industrial and edge connectivity"
      description: "Adds RA EtherNet/IP, MQTT improvements, InfluxDB 3.0, Smart Objects, stored procedures, and enhanced CODESYS support."
    - title: "ThinManager container export"
      description: "Packages FactoryTalk Optix applications for Ubuntu thin clients managed through ThinManager."
  categories:
    - name: "Core capabilities"
      items:
        - title: "User-defined project templates"
          detail: "Package layouts, screens, widgets, faceplates, users, groups, and system objects as reusable project starters with emulation and version-control support."
          pages: "pp. 6-7"
        - title: "Structured datatype editing"
          detail: "Displays and edits structures directly in Studio and supports DynamicLinks to individual elements."
          pages: "pp. 8-10"
        - title: "Structured Model-to-OPC UA binding"
          detail: "Binds compatible structured Model data to OPC UA data with one DynamicLink."
          pages: "pp. 8-10"
        - title: "Custom Virtual Keyboard"
          detail: "Supports reusable keyboard templates, language switching, target inputs, and Web-session display."
          pages: "pp. 12-13"
        - title: "ScrollView controls"
          detail: "Adds position calculation, step scrolling, and a method to scroll to a child object."
          pages: "p. 14"
        - title: "Screen and Rectangle styles"
          detail: "Makes Screen and Rectangle appearance configurable through stylesheets."
          pages: "p. 15"
        - title: "Typed Key-Value Converter maps"
          detail: "Preconfigures converter entries with explicit data types."
          pages: "p. 16"
        - title: "Alarm Widget improvements"
          detail: "Adds status and inhibit sorting, responsive behavior, retained settings, and guidance for logging comments."
          pages: "p. 17"
        - title: "User-password project-secret encryption"
          detail: "Encrypts local project secrets with a password supplied by the user."
          pages: "p. 18"
        - title: "FactoryTalk Optix Studio CLI"
          detail: "Automates project build, deployment, and export from the command line."
          pages: "pp. 19-20"
        - title: "Library import through NetLogic"
          detail: "Uses the design-time C# API to import library objects and handle naming conflicts."
          pages: "p. 21"
    - name: "Data connectivity"
      items:
        - title: "Rockwell Automation EtherNet/IP driver"
          detail: "Adds the RA EtherNet/IP communications driver."
          pages: "p. 4"
        - title: "Logix Block Read"
          detail: "Adds block-read support for Logix controller data."
          pages: "p. 4"
        - title: "FTDS controller support"
          detail: "Introduces FactoryTalk Design Studio controller connectivity."
          status: "Private preview"
          pages: "p. 4"
        - title: "MQTT Broker credentials"
          detail: "Protects broker access with username and password authentication."
          pages: "p. 25"
        - title: "Plain-text MQTT subscription"
          detail: "Subscribes to and consumes plain-text MQTT messages."
          pages: "p. 26"
        - title: "Custom MQTT publish payloads"
          detail: "Formats outgoing payloads as custom JSON or plain text."
          pages: "pp. 27-29"
        - title: "Store-and-forward overwrite"
          detail: "Optionally overwrites the oldest buffered records to preserve the newest continuous data."
          pages: "p. 31"
        - title: "InfluxDB 3.0 and Cloud Serverless"
          detail: "Sends operational data to the current InfluxDB 3.0 and serverless services."
          pages: "p. 32"
        - title: "Smart Objects import"
          detail: "Imports Logix Smart Object information models on Windows and OptixPanel through the supplied script."
          pages: "pp. 33-34"
        - title: "Stored procedure execution"
          detail: "Runs SQL stored procedures from NetLogic through Microsoft.Data.SqlClient and an ODBC Store."
          pages: "p. 35"
        - title: "CODESYS Gateway deployment"
          detail: "Automatically deploys the gateway on OptixPanel, OptixEdge, and EEC; Windows and Ubuntu still require manual installation."
          pages: "p. 36"
    - name: "Expanded architectures"
      items:
        - title: "ThinManager container export"
          detail: "Exports a zipped FactoryTalk Optix application and container for Ubuntu thin clients managed by ThinManager."
          pages: "p. 23"
    - name: "Digital design experience"
      items:
        - title: "FactoryTalk Design Studio online project import"
          detail: "Imports online FactoryTalk Design Studio projects into the engineering workflow."
          status: "Private preview"
          pages: "p. 4"

- version: "1.5"
  slug: release-1-5
  date: "October 2024"
  date_iso: "2024-10-01"
  pdf: "/pdf/ftoptix/releases/FTOptix v1.5.pdf"
  video: "https://ra.seismic.com/Link/Content/DCqDh9bbTRTVqGCHjFMXMM69CDmG"
  video_label: "Rockwell Automation video summary"
  summary: "FactoryTalk Optix 1.5 improved project-scale engineering, reporting, identity, controller alarms, MQTT, historian storage, and edge-data resilience."
  source_pages: "Source: FactoryTalk Optix v1.5 release presentation. Overview p. 4; detailed feature pages are cited above."
  highlights:
    - title: "Global Search and Replace"
      description: "Adds project-wide discovery, regular expressions, clickable results, and controlled replacement for large applications."
    - title: "Secure reporting and runtime access"
      description: "Adds charts and trends to PDF reports, OAuth 2.0 authentication, and Web Presentation TLS certificate selection."
    - title: "Integrated Logix alarm workflows"
      description: "Brings controller alarms and extended properties into Alarm Summary, Alarm Manager, and Alarm Details."
    - title: "Built-in MQTT and time-series resilience"
      description: "Adds native MQTT roles, embedded InfluxDB, and database store-and-forward."
  categories:
    - name: "Core capabilities"
      items:
        - title: "Global Search and Replace"
          detail: "Searches names and values by project scope or folder, supports regular expressions and clickable results, and performs controlled replacement without undo."
          pages: "pp. 6-7"
        - title: "Library dependency management"
          detail: "Preserves widget dependency paths when content moves between a project and a library."
          pages: "pp. 8-9"
        - title: "Stylesheet merge"
          detail: "Imports control styles from another stylesheet."
          pages: "p. 10"
        - title: "Japanese and Korean Studio languages"
          detail: "Adds localized FactoryTalk Optix Studio interfaces for Japanese and Korean."
          pages: "p. 11"
        - title: "Modal Dynamic Link dialog"
          detail: "Keeps the Dynamic Link selection workflow in a focused modal window."
          pages: "p. 12"
        - title: "Runtime Entitlement Expired event"
          detail: "Exposes an event that applications can handle when the runtime entitlement expires."
          pages: "p. 13"
        - title: "Clickable engineering errors"
          detail: "Navigates directly from configuration and DynamicLink errors to the affected project object."
          pages: "p. 14"
        - title: "Design-time navigation preview"
          detail: "Previews the startup state of Navigation Panel and Panel Loader while engineering."
          pages: "p. 15"
        - title: "Button image positioning"
          detail: "Controls where an image appears inside a Button."
          pages: "p. 16"
        - title: "Web Presentation TLS configuration"
          detail: "Selects the HTTPS certificate and private key used by the Web Presentation Engine."
          pages: "p. 17"
        - title: "PDF reports with charts and trends"
          detail: "Includes pie, histogram, XY, and Trend controls in generated PDF reports."
          pages: "p. 18"
        - title: "OAuth 2.0 authentication"
          detail: "Authenticates runtime users through an OAuth 2.0 identity provider."
          pages: "p. 19"
    - name: "Data connectivity"
      items:
        - title: "Logix controller alarms"
          detail: "Adds tag- and instruction-based alarms configured in the controller with improved detection and timestamps."
          pages: "p. 27"
        - title: "Alarm Summary"
          detail: "Combines Logix and Optix alarms with localization, filtering, shelving, acknowledge/confirm actions, rollups, and configurable columns."
          pages: "p. 28"
        - title: "Alarm Manager"
          detail: "Manages all Logix and Optix alarms, including shelving, rollups, filtering, localization, and configurable columns."
          pages: "p. 29"
        - title: "Alarm Details"
          detail: "Shows detailed information for a selected alarm."
          pages: "p. 30"
        - title: "Logix extended tag properties"
          detail: "Imports names, descriptions, engineering units, limits, states, and PlantPAx process-instruction HMI properties."
          pages: "p. 31"
        - title: "Embedded MQTT Broker"
          detail: "Provides a native Mosquitto-based broker with QoS, retention, and certificate-based security."
          pages: "p. 32"
        - title: "Secure MQTT Client"
          detail: "Connects with TLS, certificate validation, authentication, and configurable user identity."
          pages: "p. 33"
        - title: "MQTT Publisher"
          detail: "Controls sampling, period, QoS, and retained-message behavior."
          pages: "p. 34"
        - title: "MQTT Subscriber"
          detail: "Subscribes to a selected topic with configurable QoS and stores received values in a project folder."
          pages: "p. 35"
        - title: "Database store-and-forward"
          detail: "Buffers records for external ODBC and InfluxDB targets and exposes diagnostics during connectivity loss."
          pages: "p. 37"
        - title: "Embedded InfluxDB datastore"
          detail: "Stores time-series data locally with configurable retention."
          pages: "p. 38"
        - title: "OPC UA Client localeID"
          detail: "Adds a localeID parameter to OPC UA Client communication."
          pages: "p. 4"
    - name: "Expanded architectures"
      items:
        - title: "Session-independent stylesheets"
          detail: "Allows each runtime session to use its own stylesheet."
          pages: "p. 21"
    - name: "FactoryTalk Hub and portal"
      items:
        - title: "FactoryTalk Hub Help menu"
          detail: "Links directly to FactoryTalk Optix Studio Help and the Installation Guide."
          pages: "p. 23"
        - title: "Device Sizing tool"
          detail: "Helps select an appropriate device from application-size inputs."
          pages: "p. 24"
        - title: "Updated Runtime Sizing tool"
          detail: "Includes the release's MQTT and external database store-and-forward capabilities in runtime sizing."
          pages: "p. 25"

- version: "1.4"
  slug: release-1-4
  date: "May 2024"
  date_iso: "2024-05-01"
  pdf: "/pdf/ftoptix/releases/FTOptix v1.4.pdf"
  summary: "Version 1.4 strengthened Studio operation, project recovery, responsive and protected UI, alarm handling, controller connectivity, runtime packaging, and FactoryTalk Hub tooling."
  source_pages: "Source: FactoryTalk Optix v1.4 release presentation. Overview pp. 4-5; detailed feature pages are cited above."
  highlights:
    - title: "Safer upgrades and project recovery"
