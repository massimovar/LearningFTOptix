- version: "7.0.0.x"
  slug: release-7-0-0-x
  date: "September 2026"
  date_iso: "2026-09-01"
  current: true
  pdf: "/pdf/ftoptix/releases/FTOptix v1.8.pdf#page=55"
  summary: "Firmware 7.0.0.x refreshes the full device software stack and adds local browser-based HMI access, remote file access to removable media, bundle images, device backup and restore, and advanced OptixEdge networking."
  source_pages: "Source: FactoryTalk Optix v1.8 technical overview, Firmware 7.0.0.x chapter, pp. 55-63; detailed feature pages are cited above."
  notes:
    - "Firmware 7.0.0.x is presented as a chapter of the FactoryTalk Optix v1.8 technical overview, which is marked as preliminary release information and subject to change."
    - "Page references use PDF page numbers. The slide number printed on each page is one higher."
    - "Supported devices vary by feature. Some features also list Stratix 4300, which is not an Optix-based device; check each feature before deployment."
  highlights:
    - title: "Updated software stack"
      description: "Ships FactoryTalk Optix 1.8 or later, FactoryTalk Remote Access 14.3.2, System Manager 1.8, and Linux Yocto Scarthgap with kernel 6.12."
    - title: "Local and remote access"
      description: "Mirrors the HMI screen in a local web browser and opens USB memory and SD cards through Remote Access File Transfer."
    - title: "Bundle images and device backup"
      description: "Upgrades or downgrades the entire software stack in one image and restores a device configuration to the same or a replacement device."
    - title: "OptixEdge networking and provisioning"
      description: "Adds Internet Sharing, NAT Rules, and Routing Rules to OptixEdge and configures devices from a JSON file on a USB stick."
  categories:
    - name: "Software stack"
      items:
        - title: "Firmware 7.0.0.x components"
          detail: "Includes FactoryTalk Optix 1.8 (minimum version), FactoryTalk Remote Access 14.3.2, System Manager 1.8, and Linux Yocto Scarthgap with kernel 6.12 for OptixPanel, OptixEdge, and Embedded Edge Compute."
          pages: "p. 56"
    - name: "Local and remote access"
      items:
        - title: "Local Web-based Remote Desktop"
          detail: "Views and mirrors the HMI screen from a web browser on smartphones, tablets, and Linux PCs over the local network, without installing FactoryTalk Remote Access Tools. Enable the Local Connection option in System Manager."
          pages: "p. 57"
        - title: "USB memory and SD card File Transfer"
          detail: "Accesses USB memory devices and SD cards plugged into the device through File Transfer in FactoryTalk Remote Access Tools. Available for OptixPanel, OptixEdge, Embedded Edge Compute, and Stratix 4300."
          pages: "p. 58"
        - title: "Remote Access information in System Manager"
          detail: "Shows the FactoryTalk Remote Access domain name and device name in the FT Remote Access section of System Manager. Available for OptixPanel, OptixEdge, Embedded Edge Compute, and Stratix 4300."
          pages: "p. 59"
    - name: "Device lifecycle"
      items:
        - title: "Bundle image support"
          detail: "Deploys one image containing the firmware, the FactoryTalk Optix Update Server, and the default application to upgrade or downgrade the entire software stack on OptixPanel, OptixEdge, and Embedded Edge Compute."
          pages: "p. 60"
        - title: "Bundle image overwrites the application"
          status: "Caution"
          detail: "Upgrading or downgrading with a bundle image overrides the FactoryTalk Optix application deployed on the device."
          pages: "p. 60"
        - title: "Device backup and restore"
          detail: "Captures the device state in System Manager to restore the same device to a known state or apply the configuration to another device of the same type. Available for OptixPanel, OptixEdge, and Embedded Edge Compute."
          pages: "p. 61"
    - name: "Networking and provisioning"
      items:
        - title: "OptixEdge advanced networking"
          detail: "Adds Internet Sharing, NAT Rules between WAN and LAN interfaces, and static Routing Rules, configured from the System Manager web interface as on Stratix 4300."
          pages: "p. 62"
        - title: "USB Device Configurator"
          detail: "Configures a device and registers it to a FactoryTalk Remote Access domain from a JSON file on a USB stick, created with FactoryTalk Remote Access Manager. Supported on OptixEdge and Stratix 4300."
          pages: "p. 63"
