- version: "14.4"
  slug: release-14-4
  date: "2026"
  current: true
  pdf: "/pdf/ubiquity/releases/UBIQUITY 14.4 Release_v2.pdf"
  summary: "UBIQUITY 14.4 expands browser-based local access and fleet visibility, simplifies device provisioning and multi-domain identity, improves VPN performance, and modernizes hosted and private infrastructure."
  source_pages: "Source: UBIQUITY 14.4 release presentation. Feature details are cited above; the cover does not state an exact release date."
  notes:
    - "The cover is undated. “MAY 2026” appears only in the preliminary runtime-discontinuation page and is not presented as an exact release date."
    - "Page 4 gives contradictory OptixPanel availability statements for USB configuration; consult current product documentation before deployment."
    - "The PDF reports about 150% higher average end-to-end VPN throughput than Tools 14.3 but does not publish its test method or conditions."
  highlights:
    - title: "Local browser-based Remote Desktop"
      description: "Mirrors supported HMI screens from a local browser without installing UBIQUITY Tools."
    - title: "Fleet dashboard and USB provisioning"
      description: "Adds centralized device statistics and repeatable registration from System Manager JSON files on USB media."
    - title: "Multi-domain identity and visibility"
      description: "Allows one email account across domains, hides unauthorized parent folders, and reports physical MAC addresses consistently."
    - title: "Faster VPN and TLS 1.3 infrastructure"
      description: "Improves the virtual Ethernet adapter, Access Server scalability, Relay Servers, resilience, and encrypted transport."
    - title: "Kubernetes-based Private Server"
      description: "Moves UBIQUITY Private Server from a single Windows setup to separately managed Kubernetes workloads."
  categories:
    - name: "Local access and device management"
      items:
        - title: "Local Web-based Remote Desktop"
          detail: "Accesses and mirrors Remote Desktop sessions over the local network from browsers on smartphones, tablets, and Linux PCs without installing UBIQUITY Tools. It covers OptixPanel and PC runtimes; OptixPanel support starts with firmware 7.0."
          pages: "p. 2"
          status: "Feature"
        - title: "Device Statistics Dashboard"
          detail: "Adds an at-a-glance dashboard for device type, software version, connection status, and other fleet statistics."
          pages: "p. 3"
          status: "Feature"
        - title: "USB Device Configurator"
          detail: "Registers devices from a USB stick using a System Manager JSON configuration file for repeatable commissioning with fewer configuration errors."
          pages: "p. 4"
          status: "Feature"
    - name: "Identity and domain visibility"
      items:
        - title: "Single email across multiple domains"
          detail: "Lets email-and-password users access multiple domains by supplying the target domain and email address. It supports two-factor authentication and external-authentication scenarios without email aliases."
          pages: "p. 5"
          status: "Enhancement"
        - title: "Hidden Parent Folders"
          detail: "Shows subdomain users only the items they are authorized to access, hiding parent folders to improve isolation and reduce clutter and misconfiguration risk."
          pages: "p. 7"
          status: "Enhancement"
        - title: "Physical MAC address filtering"
          detail: "Displays only physical MAC addresses in Domain View and Device View, excluding virtual and bridge interfaces, including on x86 Runtime PCs."
          pages: "p. 8"
          status: "Enhancement"
    - name: "Connectivity and infrastructure"
      items:
        - title: "Improved VPN Throughput"
          detail: "Enhances the UBIQUITY Tools virtual Ethernet adapter; the PDF reports about 150% higher average end-to-end throughput than Tools 14.3."
          pages: "p. 6"
          status: "Enhancement"
        - title: "Scalable TLS 1.3 infrastructure"
          detail: "Improves Access Server scalability, updates Relay Servers, and moves communications to TLS 1.3 for stronger performance, resilience, and encryption."
          pages: "p. 9"
          status: "Enhancement"
        - title: "UBIQUITY Private Server on Kubernetes"
          detail: "Replaces the single Windows installation with separate containers for Access Server, Relay Server, WebAPI, Web Frontend, and SQL services, with centralized monitoring, logging, deployment, and updates."
          pages: "p. 10"
          status: "Enhancement"
        - title: "Managed Kubernetes deployment options"
          detail: "Allows UBIQUITY Private Server to use managed Kubernetes services from Amazon AWS, Google GKE, or Microsoft Azure and removes the Windows license requirement for this architecture."
          pages: "p. 10"
          status: "Enhancement"
    - name: "Runtime lifecycle"
      items:
        - title: "Runtime versions earlier than 3 blocked"
          detail: "The preliminary schedule states that runtimes earlier than version 3 stopped connecting in May 2025."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Runtime versions earlier than 5 warning"
          detail: "The preliminary schedule starts warnings for runtimes earlier than version 5 in June 2025."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Control Center disconnected"
          detail: "The preliminary schedule states that Control Center stopped connecting in July 2025."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Runtime versions earlier than 5 blocked"
          detail: "The preliminary schedule blocks runtimes earlier than version 5 in May 2026."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Runtime versions earlier than 8 warning"
          detail: "The preliminary schedule starts warnings for runtimes earlier than version 8 in June 2026."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Runtime versions earlier than 8 blocked"
          detail: "The preliminary schedule blocks runtimes earlier than version 8 in January 2027."
          pages: "p. 11"
          status: "Preliminary schedule"

- version: "14.3"
  slug: release-14-3
  date: "2025"
  pdf: "/pdf/ubiquity/releases/UBIQUITY 14.3 Release_v2.pdf"
  summary: "UBIQUITY 14.3 adds integrated VNC access, broader invitation workflows, least-privilege Windows Runtime operation, faster Manager administration, and removable-media file transfer on supported embedded devices."
  source_pages: "Source: UBIQUITY 14.3 release presentation. Feature details are cited above; the cover does not state an exact release date."
  notes:
    - "The cover is undated. “OCT 2025” appears only in the preliminary runtime-discontinuation page and is not presented as an exact release date."
    - "SD and USB access requires firmware 7.0 with UBIQUITY 14.3 Runtime or later; the PDF states that this firmware was planned for the first half of 2026."
  highlights:
    - title: "Integrated VNC for sub-devices"
      description: "Connects directly to VNC-enabled sub-devices through the Manager Tools client without external utilities."
    - title: "Invitations beyond existing accounts"
      description: "Invites people who do not yet have a UBIQUITY account and adds a page for tracking and administering invitations."
    - title: "Least-privilege Windows Runtime"
      description: "Restricts Runtime processes and file-transfer operations to administrator-defined privileges."
    - title: "Faster Manager administration"
      description: "Adds sub-device copy/paste, interface labels, quick actions, clearer membership and permissions, French, and in-app news."
    - title: "SD and USB file transfer"
      description: "Exposes removable-media files through UBIQUITY Tools on supported OptixEdge, OptixPanel, and RK2x devices."
  categories:
    - name: "Remote access"
      items:
        - title: "VNC Support for Sub-devices"
          detail: "Connects to VNC-enabled sub-devices through UBIQUITY Manager and the integrated Manager Tools VNC client without external tools or manual client configuration."
          pages: "p. 2"
          status: "Feature"
    - name: "Users and permissions"
      items:
        - title: "Invite users without an existing account"
          detail: "Invites people who have no UBIQUITY account and do not belong to the domain."
          pages: "p. 3"
          status: "Feature"
        - title: "User Invitations administration page"
          detail: "Adds a dedicated page for tracking and administering device invitations."
          pages: "p. 3"
          status: "Feature"
        - title: "Member of and Show Permissions"
          detail: "Improves visibility into group membership and effective permissions, especially when external authentication is configured."
          pages: "p. 8"
          status: "Enhancement"
    - name: "Runtime security"
      items:
        - title: "Least Privilege for Windows Runtime"
          detail: "Allows least-privilege operation to be selected during setup or later in the Runtime Web UI, restricting process operations and file transfers."
          pages: "p. 4"
          status: "Feature"
    - name: "Manager productivity"
      items:
        - title: "Sub-device copy and paste"
          detail: "Copies sub-devices between Runtime devices while preserving their configuration."
          pages: "p. 5"
          status: "Enhancement"
        - title: "Ethernet interface labels"
          detail: "Associates device IP addresses with their Ethernet interfaces in the device-information pane."
          pages: "p. 6"
          status: "Enhancement"
        - title: "Quick-Action Toolbar"
          detail: "Adds a toolbar at the top of the interface and revises device and folder hover buttons and folder context menus."
          pages: "p. 7"
          status: "Enhancement"
        - title: "French localization"
          detail: "Adds French to UBIQUITY Manager, UBIQUITY Runtime, and UBIQUITY Tools."
          pages: "p. 9"
          status: "Enhancement"
        - title: "In-app UBIQUITY news"
          detail: "Displays updates, releases, and fixes from ubiquity.asem.it inside UBIQUITY Manager."
          pages: "p. 9"
          status: "Enhancement"
    - name: "Embedded-device storage"
      items:
        - title: "SD and USB access in Explorer"
          detail: "Uses the UBIQUITY Tools Explorer tab to manage files on SD cards and USB memory connected to supported OptixEdge, OptixPanel, and RK2x devices."
          pages: "p. 10"
          status: "Feature"
    - name: "Runtime lifecycle"
      items:
        - title: "Runtime versions earlier than 3 blocked"
          detail: "The preliminary schedule states that runtimes earlier than version 3 stopped connecting in May 2025."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Runtime versions earlier than 5 warning"
          detail: "The preliminary schedule starts warnings for runtimes earlier than version 5 in June 2025."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Control Center disconnected"
          detail: "The preliminary schedule states that Control Center stopped connecting in July 2025."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Runtime versions earlier than 5 blocked"
          detail: "The preliminary schedule blocks runtimes earlier than version 5 in March 2026."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Runtime versions earlier than 8 warning"
          detail: "The preliminary schedule starts warnings for runtimes earlier than version 8 in April 2026."
          pages: "p. 11"
          status: "Preliminary schedule"
        - title: "Runtime versions earlier than 8 blocked"
          detail: "The preliminary schedule blocks runtimes earlier than version 8 in October 2026."
          pages: "p. 11"
          status: "Preliminary schedule"

- version: "14.2"
  slug: release-14-2
  date: "15 April 2025"
  date_iso: "2025-04-15"
  pdf: "/pdf/ubiquity/releases/UBIQUITY 14.2 Release_v1.pdf"
  summary: "UBIQUITY 14.2 expands global relay coverage and iOS VPN access, adds three interface languages, hardens Ubuntu Runtime deployment, introduces Docker packaging, and streamlines local and remote connection workflows."
  source_pages: "Source: UBIQUITY 14.2 release presentation dated 15 April 2025. Detailed feature pages are cited above."
  notes:
    - "New Relay Servers and the iOS VPN App are limited to eligible UBIQUITY X annual-fee domains or older domains where the corresponding option is already active."
    - "The runtime-discontinuation schedule is marked planned and subject to change."
  highlights:
    - title: "Five additional Relay Servers"
      description: "Adds locations in Illinois, Texas, Italy, India, and Australia to improve proximity, latency, and resilience."
    - title: "UBIQUITY VPN App for iOS"
      description: "Extends secure VPN access to eligible Apple smartphones and tablets."
    - title: "Least-privilege and containerized Runtime"
      description: "Runs Ubuntu Runtime without elevated privileges and packages Runtime for Docker on Ubuntu and Debian."
    - title: "Broader localized operation"
      description: "Adds Italian, Spanish, and German to Manager, Tools, and Runtime."
    - title: "Simpler local and remote connections"
      description: "Improves local device management, VPN-state feedback, and repeated Manager authentication."
  categories:
    - name: "Infrastructure"
      items:
        - title: "Five new Relay Servers"
          detail: "Adds Relay Servers in Illinois, Texas, a second Italian location, India, and Australia to increase the chance of a nearby connection endpoint."
          pages: "p. 2"
          status: "Enhancement"
        - title: "Improved Relay Server selection"
          detail: "Improves how UBIQUITY Runtime and Manager Tools select the best Relay Server when starting a connection."
          pages: "p. 2"
          status: "Enhancement"
        - title: "Annual-domain Relay availability"
          detail: "Makes the new Relay Servers available to UBIQUITY X domains with an annual fee."
          pages: "p. 2"
          status: "Enhancement"
    - name: "Platform and localization"
      items:
        - title: "UBIQUITY VPN App for iOS"
          detail: "Provides VPN access from Apple smartphones and tablets through an App Store application for eligible domains."
          pages: "p. 3"
          status: "Enhancement"
        - title: "Italian, Spanish, and German languages"
          detail: "Adds three languages to UBIQUITY Manager, UBIQUITY Tools, and UBIQUITY Runtime."
          pages: "p. 4"
          status: "Enhancement"
    - name: "Runtime deployment"
      items:
        - title: "Least privilege for Ubuntu 22"
          detail: "Runs Ubuntu 22 Runtime without elevated privileges while retaining existing functionality through dedicated scripts and services."
          pages: "p. 5"
          status: "Enhancement"
        - title: "Embedded browser package for Windows 10 IoT"
          detail: "Adds a separate Runtime setup package with an embedded browser for Windows 10 IoT Enterprise 2016 and 2019 LTSC systems that otherwise include unsupported Internet Explorer 11."
          pages: "p. 6"
          status: "Enhancement"
        - title: "Docker Runtime image"
          detail: "Packages UBIQUITY Runtime as a Docker image for x86 Ubuntu 22.04 and Debian 11.9 systems with Remote Desktop, VPN, Sub-device, Assistance Request, and Local Connection support."
          pages: "p. 7"
          status: "Enhancement"
    - name: "Connection experience"
      items:
        - title: "Local Connection device management"
          detail: "Adds custom device names, secure password storage, and a dedicated Manage Devices page, including support for networks without a DNS server."
          pages: "p. 8"
          status: "Enhancement"
        - title: "Interactive Tools VPN animation"
          detail: "Shows a flow animation in the Connection tab while the VPN tunnel is active."
          pages: "p. 9"
          status: "Enhancement"
        - title: "Remembered Manager login identity"
          detail: "Stores the domain, username, and email in browser local storage for internal and external authentication; the PDF does not state that passwords are stored."
          pages: "p. 10"
          status: "Enhancement"
    - name: "Runtime lifecycle"
      items:
        - title: "Runtime versions earlier than 3 warning"
          detail: "The planned schedule records the warning introduced with release 14 in July 2024."
          pages: "p. 11"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 3 blocked"
          detail: "The planned schedule blocks runtimes earlier than version 3 in May 2025."
          pages: "p. 11"
          status: "Planned schedule"
        - title: "Control Center disconnected"
          detail: "The planned schedule states that Control Center stops connecting in May 2025."
          pages: "p. 11"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 5 warning"
          detail: "The planned schedule starts warnings for runtimes earlier than version 5 in June 2025."
          pages: "p. 11"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 5 blocked"
          detail: "The planned schedule blocks runtimes earlier than version 5 in December 2025."
          pages: "p. 11"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 8 warning"
          detail: "The planned schedule starts warnings for runtimes earlier than version 8 in January 2026."
          pages: "p. 11"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 8 blocked"
          detail: "The planned schedule blocks runtimes earlier than version 8 in October 2026."
          pages: "p. 11"
          status: "Planned schedule"

- version: "14.1"
  slug: release-14-1
  date: "27 November 2024"
  date_iso: "2024-11-27"
  pdf: "/pdf/ubiquity/releases/UBIQUITY 14.1 Release_v1.pdf"
  summary: "UBIQUITY 14.1 introduces a cross-platform Runtime Web UI, expands Windows and Ubuntu support, adds Chinese localization, optimizes relay selection, and exposes VPN and File Transfer through a new SDK."
  source_pages: "Source: UBIQUITY 14.1 release presentation dated 27 November 2024. Detailed feature pages are cited above."
  notes:
    - "The runtime-obsolescence schedule is marked planned and subject to change."
  highlights:
    - title: "Runtime Web-based UI"
      description: "Adds browser-based Runtime administration on Windows and Linux with optional password protection."
    - title: "Windows 11 and Ubuntu 22 support"
      description: "Certifies Windows 11 Runtime and brings offline Local Connection to x86 Ubuntu 22 systems."
    - title: "Chinese localization"
      description: "Adds Chinese across FT Remote Access Manager, Runtime, and Tools."
    - title: "Optimized Relay Server Selection"
      description: "Uses proximity, responsiveness, and server load to reduce VPN latency and jitter."
    - title: "VPN and File Transfer SDK"
      description: "Enables custom integrations that establish VPN connections and exchange files securely."
  categories:
    - name: "Runtime and local access"
      items:
        - title: "Runtime Web-based UI"
          detail: "Adds an installable web interface for UBIQUITY Runtime on Windows and Linux with an optional password that restricts access on the Runtime PC."
          pages: "p. 2"
          status: "Feature"
        - title: "Windows 11 Runtime support"
          detail: "Adds full support for running UBIQUITY Runtime on Windows 11."
          pages: "p. 3"
          status: "Enhancement"
        - title: "Ubuntu 22 Local Connection"
          detail: "Enables Interactive Access over the local network without internet access on x86 industrial PCs running Ubuntu 22 Runtime."
          pages: "p. 4"
          status: "Enhancement"
    - name: "Localization"
      items:
        - title: "Chinese language"
          detail: "Adds Chinese to FT Remote Access Manager, FT Remote Access Runtime, and FT Remote Access Tools."
          pages: "p. 5"
          status: "Feature"
    - name: "Connectivity and integration"
      items:
        - title: "Optimized Relay Server Selection"
          detail: "Evaluates proximity, responsiveness, and varying CPU load to select a faster, more reliable Relay Server for VPN connections."
          pages: "p. 6"
          status: "Enhancement"
        - title: "VPN and File Transfer SDK"
          detail: "Combines a new SDK with Web APIs so integrated systems can establish VPN connections and securely send and receive files."
          pages: "p. 7"
          status: "Enhancement"
    - name: "Authentication and support"
      items:
        - title: "Assistance Request email address"
          detail: "Changes the Assistance Request contact address to ubiquity@asem.it."
          pages: "p. 8"
          status: "Enhancement"
        - title: "External-user identity visibility"
          detail: "Shows first and last names for OpenID external-authentication users while preventing those values from being edited."
          pages: "p. 8"
          status: "Enhancement"
        - title: "Join-domain requests disabled with OpenID"
          detail: "Disables the option that allows users to request domain membership when OpenID External Authentication is configured."
          pages: "p. 8"
          status: "Enhancement"
    - name: "Runtime lifecycle"
      items:
        - title: "Runtime versions earlier than 3 warning"
          detail: "The planned schedule records a warning for runtimes earlier than version 3 in July 2024."
          pages: "p. 9"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 3 blocked"
          detail: "The planned schedule blocks runtimes earlier than version 3 in February or March 2025."
          pages: "p. 9"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 5 warning"
          detail: "The planned schedule starts warnings for runtimes earlier than version 5 in March or April 2025."
          pages: "p. 9"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 5 blocked"
          detail: "The planned schedule blocks runtimes earlier than version 5 in November or December 2025."
          pages: "p. 9"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 8 warning"
          detail: "The planned schedule starts warnings for runtimes earlier than version 8 in February or March 2026."
          pages: "p. 9"
          status: "Planned schedule"
        - title: "Runtime versions earlier than 8 blocked"
          detail: "The planned schedule blocks runtimes earlier than version 8 in September or October 2026."
          pages: "p. 9"
          status: "Planned schedule"
